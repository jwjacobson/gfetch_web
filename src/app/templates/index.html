<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gfetch</title>
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
</head>
<body class="bg-teal-500">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="bg-blue-600/15 p-8 w-full max-w-md border border-teal-400">
            <h1 class="text-2xl font-bold text-center text-teal-950 mb-6">Welcome to Gfetch!</h1>
            <p class="text-center text-teal-950 mb-6">Here you can back up your Gmail correspondence.</p>
            <form method="POST" class="mb-6">
                <label for="email_address" class="block text-sm font-medium text-teal-950 mb-2">Enter the email address of your correspondent:</label>
                <input type="email" id="email_address" name="email_address" required
                       class="w-full px-3 py-2 border border-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-700 mb-4">
                <button type="submit" class="w-full bg-teal-700 text-slate-200 font-bold py-2 px-4 hover:bg-teal-800 focus:outline-none focus:ring-1 focus:ring-teal-500">Fetch Emails</button>
            </form>
            <form method="POST" action="{{ url_for('delete_files') }}">
                <button type="submit" class="w-full bg-slate-300 text-teal-800 font-bold py-2 px-4 hover:bg-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-700">Delete downloaded files</button>
            </form>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <ul class="mt-6 list-none list-inside text-center text-gray-800">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
