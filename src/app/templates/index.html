<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gfetch</title>
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
</head>
<body class="bg-emerald-900">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="bg-emerald-500 p-8 w-full max-w-md border border-emerald-400">
            <h1 class="text-2xl font-bold text-center text-emerald-950 mb-6">Welcome to Gfetch!</h1>
            <p class="text-center text-emerald-950 mb-6">Here you can back up your Gmail correspondence.</p>
            <form method="POST" class="mb-6">
                <label for="email_address" class="block text-sm font-medium text-emerald-950 mb-2">Enter the email address of your correspondent:</label>
                <input type="email" id="email_address" name="email_address" required
                       class="w-full px-3 py-2 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-800 mb-4">
                <button type="submit" class="w-full bg-emerald-700 text-stone-200 font-bold py-2 px-4 hover:bg-emerald-800 focus:outline-none focus:ring-1 focus:ring-emerald-400">Fetch Emails</button>
            </form>
            <form method="POST" action="{{ url_for('delete_files') }}">
                <button type="submit" class="w-full bg-stone-300 text-emerald-900 font-bold py-2 px-4 hover:bg-stone-400 focus:outline-none focus:ring-1 focus:ring-stone-500">Delete downloaded files</button>
            </form>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <ul class="mt-6 list-none list-inside text-center text-gray-800">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
